<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feliz Dia dos Namorados ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  font-family:'Poppins', sans-serif;
}

/* FUNDO */
.container{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container::before{
  content:"";
  position:absolute;
  inset:0;

  background:url("DUDA.jpeg") center/cover no-repeat;
  filter:blur(20px) brightness(0.5);
  transform:scale(1.2);
}

.container::after{
  content:"";
  position:absolute;
  inset:0;
  background:url("DUDA.jpeg") center/contain no-repeat;
}

/* OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.6));
}

/* TEXTO */
.content{
  position:relative;
  z-index:2;
  text-align:center;

  width:min(800px, 90vw);
  padding:25px;

  animation:fadeIn 2s ease;
}

.title{
  font-family:'Great Vibes', cursive;
  font-size:clamp(2.5rem, 6vw, 5.5rem);
  color:#fff;
  text-shadow:0 0 20px rgba(255,0,100,.8);
  margin-bottom:20px;
}

.message{
  font-size:clamp(1rem, 2.2vw, 1.8rem);
  color:white;
  font-weight:600;
  line-height:1.6;
  text-shadow:2px 2px 10px rgba(0,0,0,.8);
}

.signature{
  margin-top:35px;
  color:white;
  font-size:1.2rem;
  letter-spacing:2px;
  opacity:.9;
}

.glow{
  color:#ffb3c7;
}

/* CORAÇÕES */
.hearts{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:1;
}

.heart{
  position:absolute;
  color:#ff4d88;
  font-size:24px;
  animation:float 8s linear infinite;
  opacity:.8;
}

/* ANIMAÇÕES */
@keyframes float{
  0%{transform:translateY(100vh) rotate(0deg); opacity:0;}
  20%{opacity:1;}
  100%{transform:translateY(-120px) rotate(360deg); opacity:0;}
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

/* RESPONSIVO */
@media (max-width:768px){

  .content{
    width:92vw;
    padding:18px;
  }

  .title{
    font-size:2.3rem;
  }

  .message{
    font-size:1rem;
    line-height:1.4;
  }

  .signature{
    font-size:1rem;
  }

  .container::after{
    background-size:cover;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="overlay"></div>

  <div class="hearts" id="hearts"></div>

  <div class="content">
    <h1 class="title">
      ❤️ Feliz Dia Dos Namorados, Meu Amor ❤️
    </h1>

    <p class="message">
      Hoje Você É Minha <span class="glow">Mulher</span>,
      Mas Lembro Quando Você Era Apenas Uma Fã,
      Implorando Por Uma Chance. ❤️
    </p>

    <div class="signature">
      Para sempre nós dois ✨
    </div>
  </div>

</div>

<script>
const heartsContainer = document.getElementById("hearts");

function createHeart(){
  const heart = document.createElement("div");
  heart.classList.add("heart");

  const emojis = ["❤️","💕","💖","💘","💝"];
  heart.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];

  heart.style.left = Math.random()*100 + "vw";
  heart.style.fontSize = (20 + Math.random()*35) + "px";
  heart.style.animationDuration = (5 + Math.random()*5) + "s";

  heartsContainer.appendChild(heart);

  setTimeout(()=> heart.remove(), 10000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
